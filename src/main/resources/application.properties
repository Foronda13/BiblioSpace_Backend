spring.application.name=backend

# -------------------------------------------------------------
# SERVIDOR Y CONTEXTO
# -------------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------
# CONEXIÓN A BASE DE DATOS (Ejemplo PostgreSQL)
# -------------------------------------------------------------
# Reemplaza 'bibliospace_db', 'postgres' y 'tu_password' con tus valores reales
spring.datasource.url=jdbc:postgresql://localhost:5432/bibliospace_db
spring.datasource.username=postgres
spring.datasource.password=Noah0912
spring.datasource.driver-class-name=org.postgresql.Driver

# Si utilizas MySQL, comenta las líneas anteriores y usa:
# spring.datasource.url=jdbc:mysql://localhost:3306/bibliospace_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=tu_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------
# CONFIGURACIÓN JPA / HIBERNATE
# -------------------------------------------------------------
# 'update' creará o actualizará automáticamente las tablas según tus entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# -------------------------------------------------------------
# Clave secreta (debe tener al menos 256 bits / 32+ caracteres para HMAC-SHA256)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Tiempo de expiración del token (86400000 ms = 24 horas)
jwt.expiration-ms=86400000